[recipe-description]
rabbasca-extend-hack=Significantly slows down health deterioration of [entity=rabbasca-vault-console], extending the ongoing hack.\nNote that all items in [entity=rabbasca-vault-console] will be lost once the hack ends, potentially wasting resources.
rabbasca-warp-sequence=Warps something into or out of [virtual-signal=rabbasca-warp-inventory].\nWill do one of the following, depending on technologies researched (in that order):\n[recipe=rabbasca-warp-sequence-reverse]\n[recipe=rabbasca-warp-sequence-tile]\n[recipe=rabbasca-warp-sequence-building]\n[recipe=rabbasca-warp-sequence-upgrade]\n[recipe=rabbasca-warp-sequence-module]\n\nThis recipe is auto-selected if the pylon currently has no recipe selected and a valid order (ghost placed, structure marked for deconstruction, etc.) is created nearby. Once all orders have been completed or canceled, this recipe wil de-select itself automatically.
rabbasca-warp-sequence-building=Warps in buildings for [entity=entity-ghost].
rabbasca-warp-sequence-tile=Warps in tiles for [entity=tile-ghost].
rabbasca-warp-sequence-upgrade=Upgrades buildings and sends the replaced building to [virtual-signal=rabbasca-warp-inventory].
rabbasca-warp-sequence-module=Warps modules and other item requests into [entity=item-request-proxy]. Item removal requests for non-warpable items are sent to the pylon's trash inventory or spilled to the ground.
rabbasca-warp-sequence-reverse=Deconstructs buildings and [entity=item-on-ground] marked for deconstruction. Buildings, modules and tiles will be sent to [virtual-signal=rabbasca-warp-inventory], everything else will end up inside the pylon's inventory. Contents of deconstructed buildings will be spilled to the ground and marked for deconstruction.
rabbasca-security-modulation-up=Raises global alertness modifier on [planet=rabbasca] by 10%. The modifier is added to the alertness level from hacked vaults and can be positive or negative.\nMinimum: -50%, Maximum: +50%.
rabbasca-security-modulation-down=Reduces global alertness modifier on [planet=rabbasca] by 10%. The modifier is added to the alertness level from hacked vaults and can be positive or negative.\nMinimum: -50%, Maximum: +50%.
rabbasca-quality-assurance=Upgrade the quality of this vault to the quality of this recipe. Can only increase the quality, crafting this with lower or same quality as the vault will do nothing.\n\nThis will also upgrade the attached console amd immediately stop the ongoing hack.\nDefensive bots inherit the quality of their vault, making them stronger. Higher quality vaults craft faster without increasing [item=vault-security-key] upkeep cost.
rabbasca-core-extraction-protocol=Initiate the vault's self destruction in order to expose its core.\n[color=yellow]WARNING: The core is highly volatile and will likely cause destruction in a large area. Rabbascan defenses will be put on maximum alert.\nTake appropriate measures before continuing![/color]

