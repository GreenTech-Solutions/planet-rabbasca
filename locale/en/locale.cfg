[entity-description]
rabbasca-vault-crafter=Can be hacked through [entity=rabbasca-vault-spawner] to access resources in exchange for Carotene. Hacked vaults contribute to enemy alertness level.\n(See [tip=rabbasca-vaults] for more info)
rabbasca-energy-source=Strong energy signatures from deep below provide a limited but stable power supply, but prevent any other form of electricity generation.
rabbasca-vault-warp-spawner-inactive=A rabbascan defense mechanism capable of warping in large amounts of additional defenses. Currently dormant. Turns into hackable [entity=rabbasca-vault-warp-spawner] when detecting nearby threats.
rabbasca-vault-warp-spawner=Active version of [entity=rabbasca-vault-warp-spawner-inactive]. A rabbascan defense mechanism capable of warping in large amounts of additional defenses. Very robust, but deteriorates over time. Can be hacked with [item=vault-security-key] to create [entity=rabbasca-warp-pylon].
rabbasca-warp-pylon=Warps in ghosts placed in its construction radius from [virtual-signal=rabbasca-warp-inventory].\nMust be placed on [tile=rabbasca-energetic-concrete].\nObtained by hacking [entity=rabbasca-vault-warp-spawner].
rabbasca-vault-spawner=Defends its connected [entity=rabbasca-vault-crafter]. Can be hacked with [item=vault-access-key] to create [entity=rabbasca-vault-console]. The hack expires after some time but can be extended by inserting certain items.
vault-defender-1=Does not attack, but occasionally summons [entity=vault-distractor] for help.
vault-defender-heavy=Slow and bulky.
vault-defender-charged=Fast and deadly.
rabbasca-vault-meltdown=MELTDOWN IMMINENT!\nEVACUATE!\nIMMEDIATELY!
rabbasca-warp-uplink=A container that moves warpable items placed into it to [virtual-signal=rabbasca-warp-inventory]. Only placeables (buildings and tiles) and modules are warpable.\nAlso acts as a requester chest and comes with a logistic section that contains the item counts in [virtual-signal=rabbasca-warp-inventory], which can be used to offset requests.\n(see [tip=rabbasca-warp-inventory] for more info)

