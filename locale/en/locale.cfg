[mod-setting-description]
rabbasca-cap-bunnyhop-research=Remove Bunnyhop infinity research, limiting jumps to moons and close planets only.
rabbasca-bunnyhop-force-naked=Makes it impossible to carry items during bunnyhops, reducing it to a quicker alternative to using the rocket silo.\nWith this enabled, exporting items from Rabbasca will be impossible until the late game. Only use this option if you plan to move your science setup to Rabbasca, or don't need any Rabbascan tech.
rabbasca-bunnyhop-rabbasca-only=Makes the [item=bunnyhop-engine] unusable on any planet other than Rabbasca.
rabbasca-evolution-per-vault=Rabbasca's evolution alternative is calculated by multiplying this value in percent by the number of currently hacked vaults.\nA value of 2.5 means that every time exactly 10 vaults are hacked, evolution on Rabbasca will be 25%. This value is independent of game evolution settings. To disable evolution on Rabbasca, set this value to 0.\n\nNote that the ingame value will only update once a vault was hacked or a hack expired.
rabbasca-show-alertness-ui=Add a small UI indicator to the top left showing current alertness level. The indicator is only visible while looking at Rabbasca's surface.\nChanges to this value will be applied after the next alertness update or when looking at different surfaces.
rabbasca-surface-megawatts=The amount of power available for use in Rabbasca's electricity grid.\nAlso limits the maximum energy requirement for machines to get an unlockable [item=harene-ears-core] upgrade. (For compatibility reasons, machines with [item=harene-ears-core] upgrade already placed will continue to exist but no longer be craftable)
rabbasca-harene-easy-mode=Crafting __FLUID__harene__ requires multiple steps on different planets. This setting removes surface conditions of some items involved.
rabbasca-no-extra-category=Removes the separate Rabbasca tab in factoriopedia and crafting ui, moving the items and recipes into existing categories
rabbasca-ears-local-only=When active, buildings with E.A.R.S. require a harenic energy field to be built. Also drastically reduces crafting time for E.A.R.S. subcores to compensate.\nEnergetic concrete can still be placed on any planet. This setting does not affect warp pylons.  
rabbasca-bunnyhop-cooldown=Changing this setting only applies to cooldowns started afterwards and does not reset or alter ongoing cooldowns.
rabbasca-deconstruct-captured-pylons=When active, after successfully hacking a __ENTITY__rabbasca-vault-warp-spawner__, the resulting __ENTITY__rabbasca-warp-pylon__ will be marked for deconstruction.
rabbasca-enable-new-vault-progression=A new way of unlocking harenic lava is gated behind crafting instead of combat. The previous way led to a lot of confusion and caused some compatibility issues with other combat-related mods. Check the unhealthy fluids technology for more info.
rabbasca-warp-core-spoils=When disabled, [item=rabbasca-warp-core] no longer spoils, so it will not explode by itself after a while. Throwing behaviour is unaffected.
rabbasca-hard-science=Makes crafting [item=athletic-science-pack] more complicated by adding [item=exoskeleton-equipment] to its ingredients. Produces slightly more packs.
rabbasca-map-dark-mode=Does rabbasca's map view burn your eyes? Now you can look at the map any time of the day! (Recolors tiles on map view, no effect to how the world looks)
rabbasca-expand-athletic-science-usage=Add athletic science pack as input for technologies beyond the solar system edge

